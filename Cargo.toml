[package]
name = "jfr_parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Muthu Palaniyappan <muthu892542@gmail.com>"]
description = "Fast, low-memory, dependency-free reader and query engine for Java Flight Recorder (JFR) files"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Muthu-Palaniyappan-OL/jfr-parser"
keywords = ["jfr", "java", "profiling", "flight-recorder", "parser"]
categories = ["parser-implementations", "development-tools::profiling"]
include = ["src/**", "examples/**", "docs/**", "README.md", "CHANGELOG.md", "LICENSE", "Cargo.toml"]

[lib]
name = "jfr_parser"
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.bench]
inherits = "release"
